# Pushing a version tag (v0.8.0) builds the DMG and publishes it on a GitHub release.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  release:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Tag matches VERSION
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)" ] || { echo "::error::tag $GITHUB_REF_NAME doesn't match VERSION $(cat VERSION)"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v h="## $v" '$0 == h {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::CHANGELOG.md has no '## $v' section"; exit 1; }
          printf '\nFull history: https://github.com/%s/blob/main/CHANGELOG.md\n' "$GITHUB_REPOSITORY" >> notes.md
      - name: Build DMG
        run: scripts/make_dmg.sh dist/Project-Gravemind-Mac-Port.dmg
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Project-Gravemind-Mac-Port.dmg \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
